[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetscribe"
version = "0.2.0"
description = "Record and transcribe Google Meet calls on Linux and take live notes with pluggable skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
    "httpx>=0.25",
    "anthropic[bedrock]>=2.8",
    "faster-whisper>=1.0",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
meetscribe = "meetscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meetscribe = ["builtin_skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
