[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minutaur"
version = "0.3.0"
description = "Takes the minutes of your Linux meetings: records, transcribes, and keeps live notes with pluggable skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
    "anthropic[bedrock]>=2.8",
    "faster-whisper>=1.0",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minutaur = "minutaur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minutaur = ["builtin_skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
