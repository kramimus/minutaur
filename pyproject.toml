[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "minutaur"
version = "0.3.0"
description = "Takes the minutes of your Linux meetings: records, transcribes, and keeps live notes with pluggable skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
    "anthropic[bedrock]>=2.8",
    "faster-whisper>=1.0",
]

[project.scripts]
minutaur = "minutaur.cli:main"

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
